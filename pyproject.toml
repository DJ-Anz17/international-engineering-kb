[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "international-engineering-kb"
version = "0.1.0"
description = "Local-first international engineering personal knowledge base"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0,<7.0"]

[project.scripts]
ieg-kb = "ieg_kb.__main__:main"

[tool.setuptools.packages.find]
include = ["ieg_kb*"]
